{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — SIGID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2><i class="bi bi-box-seam-fill"></i> SIGID</h2>
            <p class="subtitle">Sistema de Control de Stock</p>

            {% if form.errors %}
                <div class="alert-sigid alert-error">
                    <i class="bi bi-x-circle-fill"></i>
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--bg-secondary);border-color:var(--border-color);color:var(--text-muted);">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text" name="username" id="id_username"
                               class="form-control" placeholder="Tu usuario"
                               autofocus required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--bg-secondary);border-color:var(--border-color);color:var(--text-muted);">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" name="password" id="id_password"
                               class="form-control" placeholder="Tu contraseña"
                               required>
                    </div>
                </div>
                <button type="submit" class="btn-sigid w-100" style="padding:0.75rem;">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </button>
            </form>
        </div>
    </div>
</body>
</html>
